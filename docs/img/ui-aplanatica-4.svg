  <text x="16.0" y="227.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">En un sistema aplanático los puntos fuera de eje enfocan de forma</text>
