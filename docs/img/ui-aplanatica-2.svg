  <text x="16.0" y="111.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Con el modo «Superficies libres» se introducen los tres puntos</text>
  <text x="16.0" y="126.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">conjugados y la extensión deriva los parámetros de forma GOTS (G, O, T, S)</text>
  <text x="16.0" y="141.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">de ambas superficies mediante las Ecs. 10-13 de la tesis.</text>
  <text x="16.0" y="156.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start"></text>
  <text x="16.0" y="171.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">El singlete resultante es rigurosamente estigmático para el par axial</text>
  <text x="16.0" y="186.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">(d₀ → d₂), pero en general NO aplanático. La pestaña «Análisis» mide</text>
  <text x="16.0" y="201.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">cuánto se aparta: (M − 1)_RMS de la Ec. 94 y la condición seno de Abbe.</text>
  <text x="16.0" y="216.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start"></text>
  <text x="16.0" y="231.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">Es el modo para explorar diseños propios y reproducir barridos como el</text>
  <text x="16.0" y="246.0" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="10.5" fill="#6b6b6b" font-weight="normal" text-anchor="start">de la Fig. 16 de la tesis (búsqueda del factor de forma óptimo).</text>
